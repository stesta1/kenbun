# Operadores del sistema (RNF5). Copiar a config/operators.yaml, que git ignora porque tiene claves.
#
# Cada operador entra con su propia clave: la clave lo identifica (queda registrado como autor de
# cada confirmación, descarte o corrección) y define qué cámaras puede ver. Sin `cameras`, ve todas.
# Se agregan con:  python scripts/add_operator.py NOMBRE --cameras cam-01,cam-02
operators:
  - name: operadora-manana
    key: reemplazar-por-una-clave-larga-y-unica
    # sin 'cameras': ve todas las cámaras

  - name: operador-comuna-15
    key: reemplazar-por-otra-clave-larga-y-unica
    cameras: [cam-01, cam-02]
