    comuna: "1"
    ubicacion: "Av. Independencia y Sarandí"  # calles de la cámara: el chat la usa para buscar por lugar

  - camera_id: cam-02
    label: "Av. Rivadavia y Boyacá"
    source: "rtsp://localhost:8554/cam-02"
    comuna: "11"
