  - camera_id: cam-demo
    label: "Video de ejemplo"
    source: "rtsp://localhost:8554/cam-demo"
    # Publicar un video con: python scripts/simulate_ip_camera.py --camera-id cam-demo --source-file <archivo.mp4>
    # Para una cámara IP real, se la registra en MediaMTX y se usa el path republicado.
